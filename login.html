<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - AlumniX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-body {
            padding: 40px 30px;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 13px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #555;
            font-size: 13px;
        }

        .footer-section a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-section a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>AlumniX</h1>
            <p>Welcome back</p>
        </div>

        <div class="login-body">
            <div id="alert" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">Log In</button>
            </form>

            <div style="margin: 20px 0; display: flex; align-items: center; gap: 12px;">
                <div style="flex: 1; height: 1px; background: #e0e0e0;"></div>
                <span style="color: #999; font-size: 12px;">OR</span>
                <div style="flex: 1; height: 1px; background: #e0e0e0;"></div>
            </div>

            <button type="button" class="login-btn" id="googleLoginBtn" style="background: white; color: #333; border: 1px solid #e0e0e0; gap: 10px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>

            <div class="footer-section">
                Don't have an account? <a href="signup.html">Sign up here</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>

    <script>
        function showAlert(msg, type = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = msg;
            alert.className = `alert show ${type}`;
            console.log(`[${type}]`, msg);
            alert.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        async function waitForSupabase(maxAttempts = 20) {
            for (let i = 0; i < maxAttempts; i++) {
                if (window.supabaseClient && window.supabaseClient.auth) {
                    console.log('[Login] Supabase client ready');
                    return window.supabaseClient;
                }
                console.log(`[Login] Waiting for Supabase... attempt ${i + 1}`);
                await new Promise(res => setTimeout(res, 200));
            }
            throw new Error('Supabase client failed to initialize. Please refresh the page.');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showAlert('Please fill in all fields', 'error');
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showAlert('Please enter a valid email address', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Logging in...';

            try {
                const client = await waitForSupabase();
                console.log('[Login] Calling Supabase auth.signInWithPassword...');

                const { data, error } = await client.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    console.error('[Login] Auth error:', error);
                    if (error.message.toLowerCase().includes('invalid login credentials')) {
                        throw new Error('Invalid email or password');
                    }
                    throw new Error(error.message || 'Login failed');
                }

                if (!data || !data.user) {
                    throw new Error('Login failed - no user data returned');
                }

                const user = data.user;
                console.log('[Login] ✅ Login successful:', user.id);

                const userData = {
                    id: user.id,
                    email: user.email,
                    full_name: user.user_metadata?.full_name || email.split('@')[0],
                    role: user.user_metadata?.role || 'student',
                    department: user.user_metadata?.department || 'Computer Science',
                    batch: user.user_metadata?.batch || null,
                    company: user.user_metadata?.company || null,
                    job_role: user.user_metadata?.job_role || null
                };

                localStorage.setItem('alumnix_user', JSON.stringify(userData));

                showAlert('Login successful! Redirecting to dashboard...', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 1500);

            } catch (error) {
                console.error('[Login Error]', error);
                const errorMsg = error.message || 'Login failed. Please try again.';
                showAlert(errorMsg, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Log In';
            }
        });

        // Google Login Handler
        document.getElementById('googleLoginBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('googleLoginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Signing in...';

            try {
                const client = await waitForSupabase();
                console.log('[Google Login] Starting OAuth flow...');

                // Use Supabase's Google OAuth provider
                const { data, error } = await client.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: `${window.location.origin}/dashboard.html`
                    }
                });

                if (error) {
                    console.error('[Google Login] OAuth error:', error);
                    throw new Error(error.message || 'Google sign-in failed');
                }

                console.log('[Google Login] OAuth initiated');

            } catch (error) {
                console.error('[Google Login Error]', error);
                showAlert(error.message || 'Google sign-in failed. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = '🔗 Continue with Google';
            }
        });
    </script>
</body>
</html>
