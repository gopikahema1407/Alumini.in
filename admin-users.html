<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - AlumniX Admin</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }
        .admin-header {
            margin-bottom: 30px;
        }
        .admin-header h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
        }
        .users-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .users-table th {
            background: #f5f5f5;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid #e0e0e0;
        }
        .users-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        .users-table tr:hover {
            background: #f9f9f9;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }
        .role-student {
            background: #e3f2fd;
            color: #1565c0;
        }
        .role-alumni {
            background: #f3e5f5;
            color: #6a1b9a;
        }
        .role-admin {
            background: #ffebee;
            color: #c62828;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-sm:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div id="top-header-container"></div>
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="admin-container">
            <div class="admin-header">
                <h1>👥 User Management</h1>
                <p style="color: #999; margin: 0;">Manage all users on the platform</p>
            </div>

            <table class="users-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Department</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px;">
                            <div style="color: #999;">Loading users...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="bottom-nav-container"></div>

    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/role-shell.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = window.authService.getCurrentUser();
            if (!user || user.role !== 'admin') {
                alert('Access denied');
                window.location.href = 'dashboard.html';
                return;
            }
            loadUsers();
        });

        async function loadUsers() {
            try {
                // Fetch all users (students)
                const studentsRes = await window.apiClient.get('/api/students');
                const students = studentsRes.data || [];

                // Fetch all users (alumni)
                const alumniRes = await window.apiClient.get('/api/alumni');
                const alumni = alumniRes.data || [];

                const allUsers = [...students, ...alumni];
                displayUsers(allUsers);
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('users-tbody').innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px; color: #999;">
                            Error loading users
                        </td>
                    </tr>
                `;
            }
        }

        function displayUsers(users) {
            const tbody = document.getElementById('users-tbody');
            
            if (!users || users.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px; color: #999;">
                            No users found
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.full_name || 'N/A'}</td>
                    <td>${u.email || 'N/A'}</td>
                    <td>
                        <span class="role-badge role-${u.role || 'student'}">
                            ${u.role || 'student'}
                        </span>
                    </td>
                    <td>${u.department || 'N/A'}</td>
                    <td>${new Date(u.created_at).toLocaleDateString() || 'N/A'}</td>
                    <td>
                        <button class="btn-sm">View</button>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
