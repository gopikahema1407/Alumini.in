<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorship Overview - AlumniX Admin</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="top-header-container"></div>
    <div id="sidebar-container"></div>

    <main class="main-content" style="max-width: 1200px; margin: 30px auto; padding: 20px;">
        <h1>🤝 Mentorship Overview</h1>
        <p style="color: #666;">Monitor and manage mentorship relationships</p>
        <p style="color: #999;">Admin interface for mentorship program oversight.</p>
        <p><a href="mentorship-requests.html" style="color: #667eea; text-decoration: none;">View Mentorship Requests →</a></p>
    </main>

    <div id="bottom-nav-container"></div>

    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/role-shell.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = window.authService.getCurrentUser();
            if (!user || user.role !== 'admin') {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
