<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings - AlumniX</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .settings-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }
        .settings-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .settings-section h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .setting-item:last-child {
            border-bottom: none;
        }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background: #ccc;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .toggle-switch.active {
            background: #4CAF50;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        .toggle-switch.active::after {
            left: 24px;
        }
    </style>
</head>
<body>
    <div id="top-header-container"></div>
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="settings-container">
            <h1 style="margin-bottom: 30px;">⚙️ Admin Settings</h1>

            <div class="settings-section">
                <h3>🔧 Platform Features</h3>
                <div class="setting-item">
                    <div>
                        <strong>Public Feed</strong>
                        <p style="margin: 5px 0 0 0; color: #999; font-size: 13px;">Enable users to share posts</p>
                    </div>
                    <div class="toggle-switch active" onclick="toggleFeature(this)"></div>
                </div>
                <div class="setting-item">
                    <div>
                        <strong>Messaging</strong>
                        <p style="margin: 5px 0 0 0; color: #999; font-size: 13px;">Enable direct messaging</p>
                    </div>
                    <div class="toggle-switch active" onclick="toggleFeature(this)"></div>
                </div>
                <div class="setting-item">
                    <div>
                        <strong>Mentorship</strong>
                        <p style="margin: 5px 0 0 0; color: #999; font-size: 13px;">Enable mentorship system</p>
                    </div>
                    <div class="toggle-switch active" onclick="toggleFeature(this)"></div>
                </div>
            </div>

            <div class="settings-section">
                <h3>📊 Admin Panel</h3>
                <p style="color: #666; margin: 0;">Platform-level administration settings for admins.</p>
            </div>
        </div>
    </main>

    <div id="bottom-nav-container"></div>

    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/role-shell.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = window.authService.getCurrentUser();
            if (!user || user.role !== 'admin') {
                window.location.href = 'dashboard.html';
            }
        });

        function toggleFeature(element) {
            element.classList.toggle('active');
        }
    </script>
</body>
</html>
