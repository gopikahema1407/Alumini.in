<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AlumniX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-wrapper {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }

        .signup-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .signup-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .signup-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .signup-body {
            padding: 40px 30px;
        }

        .role-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            background: #f0f0f0;
            border-radius: 8px;
            padding: 4px;
        }

        .role-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .role-tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 13px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 13px;
        }

        .footer-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="signup-wrapper">
        <div class="signup-header">
            <h1>AlumniX</h1>
            <p>Join our community</p>
        </div>

        <div class="signup-body">
            <div id="alert" class="alert"></div>

            <div class="role-tabs">
                <button class="role-tab active" data-role="student" type="button">Student</button>
                <button class="role-tab" data-role="alumni" type="button">Alumni</button>
            </div>

            <form id="signupForm" novalidate>
                <!-- Student Form -->
                <div id="studentSection" class="form-section active">
                    <div class="form-group">
                        <label for="studentName">Full Name</label>
                        <input type="text" id="studentName" placeholder="Your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="studentEmail">Email Address</label>
                        <input type="email" id="studentEmail" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="studentDept">Department</label>
                        <select id="studentDept" required>
                            <option value="">Select your department</option>
                            <option value="Computer Science">Computer Science & Engineering</option>
                            <option value="Electronics">Electronics & Communication</option>
                            <option value="Mechanical">Mechanical Engineering</option>
                            <option value="Civil">Civil Engineering</option>
                            <option value="Electrical">Electrical Engineering</option>
                            <option value="Information">Information Technology</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="studentBatch">Batch Year</label>
                        <input type="number" id="studentBatch" placeholder="2024" min="2020" max="2030" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="studentPass">Password</label>
                            <input type="password" id="studentPass" placeholder="Min 6 chars" required>
                        </div>
                        <div class="form-group">
                            <label for="studentPassConfirm">Confirm</label>
                            <input type="password" id="studentPassConfirm" placeholder="Confirm" required>
                        </div>
                    </div>
                </div>

                <!-- Alumni Form -->
                <div id="alumniSection" class="form-section">
                    <div class="form-group">
                        <label for="alumniName">Full Name</label>
                        <input type="text" id="alumniName" placeholder="Your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="alumniEmail">Email Address</label>
                        <input type="email" id="alumniEmail" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="alumniDept">Department</label>
                        <select id="alumniDept" required>
                            <option value="">Select your department</option>
                            <option value="Computer Science">Computer Science & Engineering</option>
                            <option value="Electronics">Electronics & Communication</option>
                            <option value="Mechanical">Mechanical Engineering</option>
                            <option value="Civil">Civil Engineering</option>
                            <option value="Electrical">Electrical Engineering</option>
                            <option value="Information">Information Technology</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="alumniYear">Graduation Year</label>
                        <input type="number" id="alumniYear" placeholder="2020" min="1980" max="2026" required>
                    </div>

                    <div class="form-group">
                        <label for="alumniCompany">Company</label>
                        <input type="text" id="alumniCompany" placeholder="Company name" required>
                    </div>

                    <div class="form-group">
                        <label for="alumniTitle">Job Title</label>
                        <input type="text" id="alumniTitle" placeholder="e.g. Senior Engineer" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="alumniPass">Password</label>
                            <input type="password" id="alumniPass" placeholder="Min 6 chars" required>
                        </div>
                        <div class="form-group">
                            <label for="alumniPassConfirm">Confirm</label>
                            <input type="password" id="alumniPassConfirm" placeholder="Confirm" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Create Account</button>
            </form>

            <div style="margin: 20px 0; display: flex; align-items: center; gap: 12px;">
                <div style="flex: 1; height: 1px; background: #e0e0e0;"></div>
                <span style="color: #999; font-size: 12px;">OR</span>
                <div style="flex: 1; height: 1px; background: #e0e0e0;"></div>
            </div>

            <button type="button" class="submit-btn" id="googleSignupBtn" style="background: white; color: #333; border: 1px solid #e0e0e0; gap: 10px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>

            <div class="footer-link">
                Already have an account? <a href="login.html">Log in here</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>

    <script>
        let activeRole = 'student';

        function showAlert(msg, type = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = msg;
            alert.className = `alert show ${type}`;
            console.log(`[${type}]`, msg);
            alert.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function switchRole(role) {
            activeRole = role;
            document.querySelectorAll('.role-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.role === activeRole);
            });
            document.getElementById('studentSection').classList.toggle('active', activeRole === 'student');
            document.getElementById('alumniSection').classList.toggle('active', activeRole === 'alumni');
        }

        document.querySelectorAll('.role-tab').forEach(tab => {
            tab.addEventListener('click', () => switchRole(tab.dataset.role));
        });

        async function waitForSupabase(maxAttempts = 20) {
            for (let i = 0; i < maxAttempts; i++) {
                if (window.supabaseClient && window.supabaseClient.auth) {
                    console.log('[Signup] Supabase client ready');
                    return window.supabaseClient;
                }
                console.log(`[Signup] Waiting for Supabase... attempt ${i + 1}`);
                await new Promise(res => setTimeout(res, 200));
            }
            throw new Error('Supabase client failed to initialize. Please refresh the page.');
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Creating account...';

            try {
                const client = await waitForSupabase();

                if (activeRole === 'student') {
                    const name = document.getElementById('studentName').value.trim();
                    const email = document.getElementById('studentEmail').value.trim().toLowerCase();
                    const dept = document.getElementById('studentDept').value;
                    const batch = document.getElementById('studentBatch').value;
                    const pass = document.getElementById('studentPass').value;
                    const passConfirm = document.getElementById('studentPassConfirm').value;

                    // Validation
                    if (!name) throw new Error('Please enter your full name');
                    if (name.length < 3) throw new Error('Name must be at least 3 characters');
                    if (!email) throw new Error('Please enter your email');
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Please enter a valid email');
                    if (!dept || dept === '') throw new Error('Please select your department');
                    if (!batch) throw new Error('Please enter your batch year');
                    if (batch < 2000 || batch > 2030) throw new Error('Please enter a valid batch year');
                    if (!pass) throw new Error('Please enter a password');
                    if (pass.length < 6) throw new Error('Password must be at least 6 characters');
                    if (pass !== passConfirm) throw new Error('Passwords do not match');

                    console.log('[Student Signup] Calling Supabase auth.signUp...');
                    const { data, error } = await client.auth.signUp({
                        email,
                        password: pass,
                        options: {
                            data: {
                                full_name: name,
                                role: 'student',
                                department: dept,
                                batch: batch
                            },
                            emailRedirectTo: window.location.origin + '/dashboard.html'
                        }
                    });

                    if (error) {
                        console.error('[Student Signup] Error:', error);
                        if (error.message.toLowerCase().includes('already registered')) {
                            throw new Error('This email is already registered. Please log in or use a different email.');
                        }
                        throw new Error(error.message || 'Signup failed');
                    }

                    if (!data || !data.user) {
                        throw new Error('Account creation failed. Please try again.');
                    }

                    const userId = data.user.id;
                    console.log('[Student Signup] ✅ Account created:', userId);

                    // Store user data in localStorage for immediate dashboard access
                    const userData = {
                        id: userId,
                        email,
                        role: 'student',
                        full_name: name,
                        department: dept,
                        batch: batch
                    };

                    localStorage.setItem('alumnix_user', JSON.stringify(userData));
                    sessionStorage.setItem('alumnix_new_signup', 'true');
                    
                    // Try to sign in immediately to create a session
                    console.log('[Student Signup] Attempting immediate sign-in...');
                    try {
                        const { data: signInData, error: signInError } = await client.auth.signInWithPassword({
                            email,
                            password: pass
                        });
                        
                        if (signInError) {
                            console.warn('[Student Signup] Immediate sign-in failed (user may need email confirmation):', signInError.message);
                        } else if (signInData?.session) {
                            console.log('[Student Signup] ✅ Session created successfully');
                        }
                    } catch (signInErr) {
                        console.warn('[Student Signup] Sign-in exception:', signInErr.message);
                    }
                    
                    showAlert('Account created successfully! Redirecting to dashboard...', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);

                } else {
                    const name = document.getElementById('alumniName').value.trim();
                    const email = document.getElementById('alumniEmail').value.trim().toLowerCase();
                    const dept = document.getElementById('alumniDept').value;
                    const year = document.getElementById('alumniYear').value;
                    const company = document.getElementById('alumniCompany').value.trim();
                    const title = document.getElementById('alumniTitle').value.trim();
                    const pass = document.getElementById('alumniPass').value;
                    const passConfirm = document.getElementById('alumniPassConfirm').value;

                    // Validation
                    if (!name) throw new Error('Please enter your full name');
                    if (name.length < 3) throw new Error('Name must be at least 3 characters');
                    if (!email) throw new Error('Please enter your email');
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Please enter a valid email');
                    if (!dept || dept === '') throw new Error('Please select your department');
                    if (!year) throw new Error('Please enter your graduation year');
                    if (year < 1980 || year > 2026) throw new Error('Please enter a valid graduation year');
                    if (!company) throw new Error('Please enter your company name');
                    if (!title) throw new Error('Please enter your job title');
                    if (!pass) throw new Error('Please enter a password');
                    if (pass.length < 6) throw new Error('Password must be at least 6 characters');
                    if (pass !== passConfirm) throw new Error('Passwords do not match');

                    console.log('[Alumni Signup] Calling Supabase auth.signUp...');
                    const { data, error } = await client.auth.signUp({
                        email,
                        password: pass,
                        options: {
                            data: {
                                full_name: name,
                                role: 'alumni',
                                department: dept,
                                batch_year: year,
                                company: company,
                                job_role: title
                            },
                            emailRedirectTo: window.location.origin + '/dashboard.html'
                        }
                    });

                    if (error) {
                        console.error('[Alumni Signup] Error:', error);
                        if (error.message.toLowerCase().includes('already registered')) {
                            throw new Error('This email is already registered. Please log in or use a different email.');
                        }
                        throw new Error(error.message || 'Signup failed');
                    }

                    if (!data || !data.user) {
                        throw new Error('Account creation failed. Please try again.');
                    }

                    const userId = data.user.id;
                    console.log('[Alumni Signup] ✅ Account created:', userId);

                    const userData = {
                        id: userId,
                        email,
                        role: 'alumni',
                        full_name: name,
                        department: dept,
                        batch_year: year,
                        company: company,
                        job_role: title
                    };

                    localStorage.setItem('alumnix_user', JSON.stringify(userData));
                    sessionStorage.setItem('alumnix_new_signup', 'true');

                    // Try to sign in immediately to create a session
                    console.log('[Alumni Signup] Attempting immediate sign-in...');
                    try {
                        const { data: signInData, error: signInError } = await client.auth.signInWithPassword({
                            email,
                            password: pass
                        });
                        
                        if (signInError) {
                            console.warn('[Alumni Signup] Immediate sign-in failed (user may need email confirmation):', signInError.message);
                        } else if (signInData?.session) {
                            console.log('[Alumni Signup] ✅ Session created successfully');
                        }
                    } catch (signInErr) {
                        console.warn('[Alumni Signup] Sign-in exception:', signInErr.message);
                    }

                    showAlert('Account created successfully! Redirecting to dashboard...', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                }

            } catch (error) {
                console.error('[Signup Error]', error);
                const errorMsg = error.message || 'Account creation failed. Please try again.';
                showAlert(errorMsg, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        });

        // Google Signup Handler
        document.getElementById('googleSignupBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('googleSignupBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Signing up...';

            try {
                const client = await waitForSupabase();
                console.log('[Google Signup] Starting OAuth flow...');

                // Use Supabase's Google OAuth provider
                const { data, error } = await client.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: `${window.location.origin}/dashboard.html`
                    }
                });

                if (error) {
                    console.error('[Google Signup] OAuth error:', error);
                    throw new Error(error.message || 'Google sign-up failed');
                }

                console.log('[Google Signup] OAuth initiated');

            } catch (error) {
                console.error('[Google Signup Error]', error);
                showAlert(error.message || 'Google sign-up failed. Please try again.', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Continue with Google';
            }
        });

        // Initialize on load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                switchRole('student');
                console.log('[Signup] Page initialized');
            });
        } else {
            switchRole('student');
            console.log('[Signup] Page initialized');
        }
    </script>
</body>
</html>
