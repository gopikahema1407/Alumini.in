<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messaging — KIT Alumni Network</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    * {
      box-sizing: border-box;
    }

    .messaging-container {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 0;
      height: calc(100vh - 60px);
      max-width: 100%;
      background: #ffffff;
      margin-top: 0;
    }

    /* Left Sidebar - Conversations List (LinkedIn style) */
    .conversations-panel {
      background: #ffffff;
      border-right: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messaging-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .messaging-title {
      font-size: 20px;
      font-weight: 700;
      color: #000;
      margin: 0;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f3f2ef;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: #e9e7e1;
    }

    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5e5;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d0cfd4;
      border-radius: 20px;
      font-size: 14px;
      background: #f8f7f3;
    }

    .search-input:focus {
      outline: none;
      border-color: #0a66c2;
      background: #ffffff;
    }

    .conversations-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .conversation-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
      text-decoration: none;
      color: inherit;
    }

    .conversation-item:hover {
      background: #f5f5f5;
    }

    .conversation-item.active {
      background: #e8f0f7;
      border-left: 4px solid #0a66c2;
      padding-left: 12px;
    }

    .conversation-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0a66c2 0%, #4a90e2 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
      position: relative;
    }

    .conversation-avatar.online::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: #31a24c;
      border: 2px solid white;
      border-radius: 50%;
      bottom: 0;
      right: 0;
    }

    .conversation-info {
      flex: 1;
      min-width: 0;
    }

    .conversation-name {
      font-weight: 600;
      font-size: 14px;
      color: #000;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-preview {
      font-size: 13px;
      color: #65676b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-preview.unread {
      font-weight: 600;
      color: #000;
    }

    /* Right Panel - Chat */
    .chat-panel {
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-title {
      font-size: 16px;
      font-weight: 700;
      color: #000;
    }

    .chat-subtitle {
      font-size: 12px;
      color: #65676b;
      margin-top: 2px;
    }

    .chat-header-right {
      display: flex;
      gap: 8px;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #ffffff;
    }

    .message-group {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }

    .message-group.sent {
      justify-content: flex-end;
    }

    .message-group.received {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 55%;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message-group.sent .message-bubble {
      background: #0a66c2;
      color: white;
    }

    .message-group.received .message-bubble {
      background: #e7f3ff;
      color: #000;
    }

    .message-time {
      font-size: 12px;
      color: #65676b;
      margin-top: 2px;
      text-align: right;
      padding: 0 12px;
    }

    .message-group.received .message-time {
      text-align: left;
    }

    .empty-chat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #65676b;
      text-align: center;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #000;
    }

    .empty-subtext {
      font-size: 14px;
      color: #65676b;
    }

    .chat-input-wrapper {
      padding: 16px 24px;
      border-top: 1px solid #e5e5e5;
      display: flex;
      gap: 8px;
      background: #ffffff;
    }

    .chat-input-container {
      flex: 1;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      max-height: 100px;
      background: #f3f2ef;
    }

    .chat-input:focus {
      outline: none;
      border-color: #0a66c2;
      background: #ffffff;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #0a66c2;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #095195;
    }

    .send-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .new-message-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .new-message-modal.open {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #000;
    }

    .modal-form-group {
      margin-bottom: 16px;
    }

    .modal-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #000;
    }

    .modal-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }

    .modal-input:focus {
      outline: none;
      border-color: #0a66c2;
      box-shadow: 0 0 0 2px rgba(10, 102, 194, 0.1);
    }

    .search-results {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 8px;
    }

    .search-result-item {
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }

    .search-result-item:hover {
      background: #f3f2ef;
    }

    .search-result-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
    }

    .search-result-info {
      flex: 1;
    }

    .search-result-name {
      font-weight: 600;
      font-size: 13px;
      color: #000;
    }

    .search-result-title {
      font-size: 12px;
      color: #65676b;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #0a66c2;
      color: white;
    }

    .btn-primary:hover {
      background: #095195;
    }

    .btn-secondary {
      background: #f3f2ef;
      color: #0a66c2;
      border: 1px solid #ccc;
    }

    .btn-secondary:hover {
      background: #e9e7e1;
    }

    @media (max-width: 768px) {
      .messaging-container {
        grid-template-columns: 280px 1fr;
      }

      .conversations-panel {
        display: none;
      }

      .messaging-container.show-list {
        grid-template-columns: 1fr;
      }

      .messaging-container.show-list .chat-panel {
        display: none;
      }

      .message-bubble {
        max-width: 85%;
      }
    }
  </style>
</head>
<body style="background-color: #ffffff; margin: 0; padding: 0;">

  <!-- Header -->
  <div id="top-header-container"></div>

  <!-- Main Messaging Area -->
  <div class="messaging-container" id="messaging-container">
    
    <!-- Left Panel: Conversations -->
    <div class="conversations-panel">
      <div class="messaging-header">
        <h2 class="messaging-title">Messaging</h2>
        <div class="header-actions">
          <button class="icon-btn" onclick="openNewMessageModal()" title="New message">
            ✎
          </button>
        </div>
      </div>

      <div class="search-box">
        <input type="text" class="search-input" id="search-conversations" placeholder="Search conversations..." />
      </div>

      <div class="conversations-scroll" id="conversations-list">
        <div style="padding: 20px; text-align: center; color: #65676b;">
          Loading conversations...
        </div>
      </div>
    </div>

    <!-- Right Panel: Chat -->
    <div class="chat-panel">
      <div id="chat-content">
        <div class="empty-chat">
          <div class="empty-icon">💬</div>
          <div class="empty-text">Your messages are private</div>
          <div class="empty-subtext">Select a conversation to start messaging or create a new one</div>
        </div>
      </div>
    </div>

  </div>

  <!-- New Message Modal -->
  <div class="new-message-modal" id="new-message-modal">
    <div class="modal-content">
      <div class="modal-title">Send a message</div>
      
      <div class="modal-form-group">
        <label class="modal-label">To:</label>
        <input type="text" class="modal-input" id="search-user" placeholder="Search by name or email..." onkeyup="searchUsers()" />
        <div class="search-results" id="search-results"></div>
      </div>

      <div class="modal-form-group">
        <label class="modal-label">Message:</label>
        <textarea class="modal-input" id="initial-message" placeholder="What would you like to say?" style="height: 100px;"></textarea>
      </div>

      <div class="modal-buttons">
        <button class="btn btn-secondary" onclick="closeNewMessageModal()">Cancel</button>
        <button class="btn btn-primary" id="send-initial-btn" onclick="sendInitialMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Sidebar & Mobile Menu (from role-shell) -->
  <div id="sidebar-container"></div>
  <div id="mobile-menu-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/role-shell.js"></script>

  <script>
    let currentUser = null;
    let allUsers = [];
    let selectedConversation = null;
    let messageRefreshInterval = null;

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const { data: sessionData } = await window.supabaseClient?.auth.getSession();
        if (!sessionData?.session?.user) {
          window.location.href = "login.html";
          return;
        }

        const userId = sessionData.session.user.id;
        
        // Get current user profile
        const profileRes = await window.apiClient.get(`/api/profile-me?user_id=${userId}`, {}, false);
        currentUser = profileRes?.user || {};
        currentUser.id = userId;

        // Load all users for search
        try {
          const usersRes = await window.apiClient.get("/api/alumni", {}, true);
          allUsers = usersRes?.alumni || [];
        } catch (err) {
          console.log("Could not load alumni list");
        }

        // Load conversations
        await loadConversations();

        // Auto-refresh every 3 seconds
        messageRefreshInterval = setInterval(loadConversations, 3000);
      } catch (err) {
        console.error("Messaging init error:", err);
      }
    });

    async function loadConversations() {
      try {
        const res = await window.apiClient.get(`/api/messages?user_id=${currentUser.id}`, {}, true);
        const messages = res?.messages || [];

        // Group by conversation
        const convMap = {};
        messages.forEach(msg => {
          const otherId = msg.sender_id === currentUser.id ? msg.recipient_id : msg.sender_id;
          const otherName = msg.sender_id === currentUser.id 
            ? (msg.recipient?.full_name || 'User') 
            : (msg.sender?.full_name || 'User');
          
          if (!convMap[otherId]) {
            convMap[otherId] = {
              id: otherId,
              name: otherName,
              messages: [],
              lastMsg: msg
            };
          }
          convMap[otherId].messages.push(msg);
          convMap[otherId].lastMsg = msg;
        });

        const conversations = Object.values(convMap).sort((a, b) => 
          new Date(b.lastMsg.created_at) - new Date(a.lastMsg.created_at)
        );

        renderConversations(conversations);
      } catch (err) {
        console.error("Load conversations error:", err);
      }
    }

    function renderConversations(conversations) {
      const list = document.getElementById("conversations-list");
      
      if (conversations.length === 0) {
        list.innerHTML = `
          <div style="padding: 20px; text-align: center; color: #65676b;">
            <div style="font-size: 12px;">No conversations yet</div>
          </div>
        `;
        return;
      }

      list.innerHTML = conversations.map(conv => {
        const initials = conv.name.split(" ").map(n => n[0]).join("").toUpperCase().slice(0, 2);
        const preview = conv.lastMsg.message_text.substring(0, 40);
        const isActive = selectedConversation?.id === conv.id;
        const time = new Date(conv.lastMsg.created_at);
        const timeStr = time.toLocaleDateString() === new Date().toLocaleDateString() 
          ? time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          : time.toLocaleDateString();

        return `
          <div class="conversation-item ${isActive ? 'active' : ''}" onclick="openConversation('${conv.id}', '${conv.name}')">
            <div class="conversation-avatar online">${initials}</div>
            <div class="conversation-info">
              <div class="conversation-name">${conv.name}</div>
              <div class="conversation-preview">${preview}</div>
            </div>
            <div style="font-size: 12px; color: #65676b; white-space: nowrap;">${timeStr}</div>
          </div>
        `;
      }).join("");
    }

    function openConversation(userId, userName) {
      selectedConversation = { id: userId, name: userName };
      loadChatMessages(userId);

      // Update active state
      document.querySelectorAll(".conversation-item").forEach(el => {
        el.classList.remove("active");
      });
      event.currentTarget.classList.add("active");
    }

    async function loadChatMessages(userId) {
      try {
        const res = await window.apiClient.get(
          `/api/messages?user_id=${currentUser.id}&recipient_id=${userId}`,
          {},
          true
        );
        const messages = res?.messages || [];

        const messagesHTML = messages.map(msg => {
          const isSent = msg.sender_id === currentUser.id;
          const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          return `
            <div class="message-group ${isSent ? 'sent' : 'received'}">
              <div>
                <div class="message-bubble">${msg.message_text}</div>
                <div class="message-time">${time}</div>
              </div>
            </div>
          `;
        }).join("");

        document.getElementById("chat-content").innerHTML = `
          <div style="display: flex; flex-direction: column; height: 100%;">
            <div class="chat-header">
              <div class="chat-header-left">
                <div>
                  <div class="chat-title">${selectedConversation.name}</div>
                  <div class="chat-subtitle">Active now</div>
                </div>
              </div>
              <div class="chat-header-right">
                <button class="icon-btn">📞</button>
                <button class="icon-btn">📹</button>
                <button class="icon-btn">ℹ️</button>
              </div>
            </div>
            <div class="messages-area" id="messages-display">
              ${messagesHTML || '<div style="text-align: center; color: #65676b;">Start a conversation</div>'}
            </div>
            <div class="chat-input-wrapper">
              <div class="chat-input-container">
                <input type="text" class="chat-input" id="message-input" placeholder="Message ${selectedConversation.name}..." onkeypress="handleKeypress(event, '${userId}')" />
                <button class="send-btn" onclick="sendMessage('${userId}')" title="Send">→</button>
              </div>
            </div>
          </div>
        `;

        // Scroll to bottom
        setTimeout(() => {
          const display = document.getElementById("messages-display");
          if (display) display.scrollTop = display.scrollHeight;
        }, 100);

        document.getElementById("message-input")?.focus();
      } catch (err) {
        console.error("Load messages error:", err);
      }
    }

    async function sendMessage(recipientId) {
      const input = document.getElementById("message-input");
      if (!input || !input.value.trim()) return;

      const text = input.value.trim();
      input.value = "";

      try {
        await window.apiClient.post("/api/messages", {
          sender_id: currentUser.id,
          recipient_id: recipientId,
          message_text: text
        });

        loadChatMessages(recipientId);
      } catch (err) {
        console.error("Send error:", err);
      }
    }

    function handleKeypress(e, recipientId) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(recipientId);
      }
    }

    function openNewMessageModal() {
      document.getElementById("new-message-modal").classList.add("open");
      document.getElementById("search-user").focus();
    }

    function closeNewMessageModal() {
      document.getElementById("new-message-modal").classList.remove("open");
      document.getElementById("search-user").value = "";
      document.getElementById("initial-message").value = "";
      document.getElementById("search-results").innerHTML = "";
    }

    function searchUsers() {
      const query = document.getElementById("search-user").value.toLowerCase();
      if (!query) {
        document.getElementById("search-results").innerHTML = "";
        return;
      }

      const filtered = allUsers.filter(u => 
        u.users?.full_name?.toLowerCase().includes(query) ||
        u.users?.email?.toLowerCase().includes(query)
      );

      const html = filtered.slice(0, 8).map(u => `
        <div class="search-result-item" onclick="selectUserToMessage('${u.id}', '${u.users?.full_name || 'User'}')">
          <div class="search-result-avatar">${(u.users?.full_name || 'U').substring(0, 1)}</div>
          <div class="search-result-info">
            <div class="search-result-name">${u.users?.full_name || 'Unknown'}</div>
            <div class="search-result-title">${u.job_role || 'Alumni'}</div>
          </div>
        </div>
      `).join("");

      document.getElementById("search-results").innerHTML = html || `<div style="padding: 12px; text-align: center; color: #65676b;">No users found</div>`;
    }

    function selectUserToMessage(userId, userName) {
      document.getElementById("search-user").value = userName;
      document.getElementById("search-results").innerHTML = "";
      document.getElementById("initial-message").focus();
      
      // Store for sending
      window.selectedMessageUser = { id: userId, name: userName };
    }

    async function sendInitialMessage() {
      const user = window.selectedMessageUser;
      const message = document.getElementById("initial-message").value.trim();

      if (!user) {
        alert("Please select a user");
        return;
      }

      if (!message) {
        alert("Please write a message");
        return;
      }

      try {
        const btn = document.getElementById("send-initial-btn");
        btn.disabled = true;

        await window.apiClient.post("/api/messages", {
          sender_id: currentUser.id,
          recipient_id: user.id,
          message_text: message
        });

        closeNewMessageModal();
        await loadConversations();
        openConversation(user.id, user.name);

        btn.disabled = false;
      } catch (err) {
        console.error("Send error:", err);
        alert("Failed to send message");
        document.getElementById("send-initial-btn").disabled = false;
      }
    }

    window.addEventListener("beforeunload", () => {
      if (messageRefreshInterval) clearInterval(messageRefreshInterval);
    });
  </script>
</body>
</html>
