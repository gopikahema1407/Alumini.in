<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts Management - AlumniX Admin</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }
        .admin-header {
            margin-bottom: 30px;
        }
        .admin-header h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
        }
        .post-item {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        .post-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        .post-meta {
            color: #999;
            font-size: 13px;
            margin: 5px 0;
        }
        .post-content {
            color: #666;
            margin: 10px 0;
            line-height: 1.6;
        }
        .btn-danger {
            background: #f44336;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-danger:hover {
            background: #d32f2f;
        }
    </style>
</head>
<body>
    <div id="top-header-container"></div>
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="admin-container">
            <div class="admin-header">
                <h1>📝 Posts & Content Moderation</h1>
                <p style="color: #999; margin: 0;">Manage posts on the platform</p>
            </div>

            <div id="posts-list"></div>
        </div>
    </main>

    <div id="bottom-nav-container"></div>

    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/role-shell.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = window.authService.getCurrentUser();
            if (!user || user.role !== 'admin') {
                alert('Access denied');
                window.location.href = 'dashboard.html';
                return;
            }
            loadPosts();
        });

        async function loadPosts() {
            try {
                const response = await window.apiClient.get('/api/posts', { limit: 100 });
                if (response.success && response.posts) {
                    displayPosts(response.posts);
                } else {
                    document.getElementById('posts-list').innerHTML = '<p style="color: #999;">No posts found</p>';
                }
            } catch (error) {
                console.error('Error loading posts:', error);
                document.getElementById('posts-list').innerHTML = '<p style="color: #999;">Error loading posts</p>';
            }
        }

        function displayPosts(posts) {
            const container = document.getElementById('posts-list');
            
            container.innerHTML = posts.map(post => `
                <div class="post-item">
                    <div class="post-header">
                        <div>
                            <h3 class="post-title">${post.title}</h3>
                            <div class="post-meta">By: ${post.users?.full_name || 'Unknown'} | ${new Date(post.created_at).toLocaleString()}</div>
                        </div>
                        <button class="btn-danger" onclick="deletePost('${post.id}')">Delete Post</button>
                    </div>
                    <div class="post-content">${post.description}</div>
                </div>
            `).join('');
        }

        async function deletePost(postId) {
            if (!confirm('Are you sure you want to delete this post?')) return;
            
            try {
                const user = window.authService.getCurrentUser();
                await window.apiClient.delete(`/api/posts/${postId}`, { user_id: user.id });
                alert('Post deleted');
                loadPosts();
            } catch (error) {
                alert('Error deleting post: ' + error.message);
            }
        }
    </script>
</body>
</html>
