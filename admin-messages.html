<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages Overview - AlumniX Admin</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }
        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="top-header-container"></div>
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="admin-container">
            <h1 style="margin-bottom: 30px;">💬 Messages Overview</h1>
            
            <div class="stat-cards">
                <div class="stat-card">
                    <div class="stat-label">Total Messages</div>
                    <div class="stat-value" id="stat-total">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Conversations</div>
                    <div class="stat-value" id="stat-conversations">--</div>
                </div>
            </div>

            <div style="background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <h3 style="margin-top: 0;">Messages Admin Overview</h3>
                <p style="color: #666;">Read-only view of message activity for moderation and support purposes.</p>
                <p style="color: #999;">For detailed messaging features, visit the Messages page.</p>
            </div>
        </div>
    </main>

    <div id="bottom-nav-container"></div>

    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/role-shell.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = window.authService.getCurrentUser();
            if (!user || user.role !== 'admin') {
                alert('Access denied');
                window.location.href = 'dashboard.html';
                return;
            }
            loadStats();
        });

        async function loadStats() {
            document.getElementById('stat-total').textContent = 'Loading...';
            document.getElementById('stat-conversations').textContent = 'Admin overview ready';
        }
    </script>
</body>
</html>
